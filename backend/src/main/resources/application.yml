server:
  port: 8080

spring:
  application:
    name: mall-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  jackson:
    time-zone: GMT+8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# 自定义配置
mall:
  jwt:
    secret: mall-backend-jwt-secret-key-please-change-in-production-2024
    expire: 86400           # token 有效期，单位秒（默认 24 小时）
    remember-expire: 604800 # 记住登录有效期，单位秒（7 天）
